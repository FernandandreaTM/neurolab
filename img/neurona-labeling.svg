<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0E2E"/>
      <stop offset="100%" stop-color="#2A1A4A"/>
    </linearGradient>
    <radialGradient id="soma" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Dendritas -->
  <g stroke="#A78BFA" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 210 100 Q 180 80 140 70"/>
    <path d="M 200 130 Q 160 130 110 120"/>
    <path d="M 215 160 Q 180 170 130 175"/>
    <path d="M 220 240 Q 180 250 140 260"/>
    <path d="M 220 270 Q 190 290 150 310"/>
    <path d="M 225 300 Q 200 320 170 350"/>
    <path d="M 230 210 Q 200 220 175 240"/>
  </g>

  <!-- Soma -->
  <ellipse cx="250" cy="200" rx="55" ry="75" fill="url(#soma)" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="240" cy="190" r="12" fill="#EC4899" opacity="0.6"/>
  <text x="240" y="195" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">Núcleo</text>

  <!-- Axón -->
  <path d="M 305 200 L 450 200" stroke="#A78BFA" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Vaina de mielina -->
  <ellipse cx="340" cy="200" rx="15" ry="12" fill="#EC4899" opacity="0.8"/>
  <ellipse cx="380" cy="200" rx="15" ry="12" fill="#EC4899" opacity="0.8"/>
  <ellipse cx="420" cy="200" rx="15" ry="12" fill="#EC4899" opacity="0.8"/>

  <!-- Botones terminales -->
  <circle cx="465" cy="195" r="6" fill="#EC4899"/>
  <circle cx="470" cy="210" r="6" fill="#EC4899"/>
  <circle cx="460" cy="220" r="6" fill="#EC4899"/>
  <circle cx="478" cy="205" r="5" fill="#EC4899"/>
  <circle cx="463" cy="225" r="5" fill="#EC4899"/>

  <!-- Etiquetas con líneas -->
  <g font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">
    <line x1="100" y1="60" x2="155" y2="85" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <text x="40" y="55">Dendritas</text>

    <line x1="270" y1="195" x2="320" y2="150" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <text x="320" y="145">Soma</text>

    <line x1="380" y1="180" x2="380" y2="120" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <text x="345" y="110">Vaina de mielina</text>

    <line x1="455" y1="195" x2="500" y2="150" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <text x="500" y="145">Axón</text>

    <line x1="475" y1="220" x2="530" y2="260" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <text x="510" y="275">Botones</text>
    <text x="510" y="290">terminales</text>
  </g>

  <!-- Hotspots (zonas clickeables para labeling) -->
  <g fill="transparent" stroke="transparent">
    <circle cx="210" cy="100" r="22" id="hotspot-dendritas" data-name="Dendritas"/>
    <circle cx="250" cy="200" r="55" id="hotspot-soma" data-name="Soma"/>
    <circle cx="380" cy="200" r="20" id="hotspot-mielina" data-name="Vaina de mielina"/>
    <circle cx="455" cy="200" r="20" id="hotspot-axon" data-name="Axón"/>
    <circle cx="470" cy="210" r="25" id="hotspot-botones" data-name="Botones terminales"/>
  </g>
</svg>
